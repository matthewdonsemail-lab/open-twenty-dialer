version: '3.8'

services:
  dialer-backend:
    build:
      context: .
      dockerfile: docker/dialer/backend/Dockerfile
    container_name: open-twenty-dialer-backend
    restart: always
    ports:
      - "4000:4000"
    environment:
      - TWENTY_BASE_URL=https://twenty.inferencesaver.com
      - TWENTY_API_KEY=${TWENTY_API_KEY}
      - TWENTY_DATABASE_URL=postgres://twenty:twenty_password_change_me@twenty-postgres:5432/twenty
      - PORT=4000
      - JWT_SECRET=${JWT_SECRET}
      - SYNC_POLL_INTERVAL_MS=30000
    networks:
      - twenty_default
    depends_on:
      - twenty-postgres
    volumes:
      - ./data:/app/data

  dialer-frontend:
    build:
      context: .
      dockerfile: docker/dialer/frontend/Dockerfile
    container_name: open-twenty-dialer-frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://dialer-backend:4000
    networks:
      - twenty_default
    depends_on:
      - dialer-backend
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

networks:
  twenty_default:
    external: true
